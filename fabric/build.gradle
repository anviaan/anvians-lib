plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version '1.2-SNAPSHOT'
}

base {
    archivesName = "${mod_id}-fabric-1.20"
}

repositories {
    maven {
        name = "Mod Menu"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.google.code.findbugs:jsr305:3.0.1"
    modLocalRuntime("com.terraformersmc:modmenu:7.0.1")
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            pom {
                name = "anvian's Lib"
                description = "A small utility library for Anvian's mods."
                url = 'https://github.com/anviaan/anvians-lib/'
                licenses {
                    license {
                        name = 'GNU GPLv3'
                        url = 'https://github.com/anviaan/anvians-lib/blob/main/LICENSE'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'anvian'
                    }
                }
            // Remove Fabric and Minecraft platform deps from the published POM — these are
            // environment-provided and must not leak as transitive dependencies.
            pom.withXml {
                asNode().dependencies.dependency.findAll {
                    it.groupId.text() == 'net.fabricmc' ||
                    it.groupId.text() == 'net.fabricmc.fabric-api' ||
                    it.groupId.text() == 'com.mojang' ||
                    it.groupId.text() == 'net.minecraft'
                }.each { it.parent().remove(it) }
            }
            }
        }
    }
    repositories {
        maven {
            name = "Reposilite"
            url = uri(version.toString().endsWith("SNAPSHOT") ?
                    "https://maven.anvian.net/snapshots" :
                    "https://maven.anvian.net/releases")
            credentials {
                username = (project.findProperty("reposilite.user") as String) ?: System.getenv("REPOSILITE_USER")
                password = (project.findProperty("reposilite.token") as String) ?: System.getenv("REPOSILITE_TOKEN")
            }
        }
    }
}