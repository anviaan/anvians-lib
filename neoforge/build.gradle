plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.41'
    id 'java-library'
}

base {
    archivesName = "${mod_id}-neoforge-1.20.2"
}

if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
    minecraft.accessTransformers.file file('src/main/resources/META-INF/accesstransformer.cfg')
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    compileOnly project(":common")
}

Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
    source(project(":common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            pom {
                name = "anvian's Lib"
                description = "A small utility library for Anvian's mods."
                url = 'https://github.com/anviaan/anvians-lib/'
                licenses {
                    license {
                        name = 'GNU GPLv3'
                        url = 'https://github.com/anviaan/anvians-lib/blob/main/LICENSE'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'anvian'
                    }
                }
            // Remove NeoForge platform deps from the published POM — these are
            // environment-provided and must not leak as transitive dependencies.
            pom.withXml {
                asNode().dependencies.dependency.findAll {
                    it.groupId.text() == 'net.neoforged' ||
                    it.groupId.text() == 'net.minecraft'
                }.each { it.parent().remove(it) }
            }
            }
        }
    }
    repositories {
        maven {
            name = "Reposilite"
            url = uri(version.toString().endsWith("SNAPSHOT") ?
                    "https://maven.anvian.net/snapshots" :
                    "https://maven.anvian.net/releases")
            credentials {
                username = (project.findProperty("reposilite.user") as String) ?: System.getenv("REPOSILITE_USER")
                password = (project.findProperty("reposilite.token") as String) ?: System.getenv("REPOSILITE_TOKEN")
            }
        }
    }
}